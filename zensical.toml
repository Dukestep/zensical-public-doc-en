# Additional CSS files loaded on every page (relative to docs/)
extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
# UI language for built-in labels (search placeholder, navigation arrows, etc.)
language = "en"

# For announcement header
custom_dir = "overrides"

# Material for MkDocs feature flags
features = [
    "announce.dismiss",         # Adds a dismiss button to the announcement bar
    "content.code.annotate",    # Enables inline annotations on code blocks
    "content.code.copy",        # Adds a copy-to-clipboard button on code blocks
    "content.code.select",      # Allows selecting individual lines in code blocks
    "content.footnote.tooltips",# Renders footnotes as tooltips on hover
    "content.tabs.link",        # Keeps tab selection in sync across the page
    "content.tooltips",         # Replaces browser title tooltips with styled ones
    "navigation.footer",        # Shows previous/next page links in the footer
    "navigation.indexes",       # Makes section index pages clickable in the nav
    "navigation.path",          # Shows a breadcrumb path below the header
    "navigation.sections",      # Renders top-level nav items as expandable sections
    "navigation.tabs",          # Displays top-level nav items as horizontal tabs
    "navigation.tabs.sticky",   # Keeps the tabs bar visible while scrolling
    "navigation.top",           # Shows a back-to-top button when scrolling up
    "navigation.tracking",      # Updates the URL anchor as the user scrolls
    "search.highlight",         # Highlights search terms on the result page
]

# Light mode palette
[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark mode palette
[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Enables the tags plugin (allows tagging pages with metadata keywords)
[project.extra.tags]
[project.plugins.tags]
# Renders Jupyter notebooks (.ipynb) as documentation pages instead of downloads
[project.plugins.mkdocs-jupyter]

# Extra site-wide variables — here used to configure the language switcher
[project.extra]
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "Français", link = "/fr/", lang = "fr" }
]

# 
[project.extra.status]
deprecated= "Retired data"

# --- Markdown extensions ---

[project.markdown_extensions.abbr]        # Abbreviation tooltips (pairs with includes/abbreviations.md glossary)
[project.markdown_extensions.admonition]  # Note/warning/tip blocks (!!! note, !!! warning, etc.)
[project.markdown_extensions.attr_list]   # HTML attributes on Markdown elements ({ .class, #id, key=value })
[project.markdown_extensions.def_list]    # Definition lists (term followed by indented definition)
[project.markdown_extensions.footnotes]   # Footnote syntax ([^1] references and definitions)
[project.markdown_extensions.md_in_html]  # Standard Markdown inside raw HTML blocks

[project.markdown_extensions.toc]          # Table of contents generation
permalink  = true                          # Adds a clickable anchor symbol next to each heading
toc_depth  = 3                             # Maximum heading depth included in the table of contents

[project.markdown_extensions.pymdownx.arithmatex] # Math rendering via MathJax ($$...$$ and \(...\) syntax)
generic = true

[project.markdown_extensions.pymdownx.betterem]    # Improved bold/italic detection around punctuation
[project.markdown_extensions.pymdownx.caret]       # Superscript (^text^) and insert (^^text^^) syntax
[project.markdown_extensions.pymdownx.details]     # Collapsible ??? blocks (collapsed by default)

[project.markdown_extensions.pymdownx.emoji]       # Emoji support — Twemoji images rendered as inline SVGs
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]   # Syntax highlighting for fenced code blocks
anchor_linenums    = true      # Adds anchor links to individual line numbers
line_spans         = "__span"  # Wraps each line in a <span> for precise CSS targeting
pygments_lang_class = true     # Adds a data attribute with the language name for CSS styling

[project.markdown_extensions.pymdownx.inlinehilite] # Syntax highlighting for inline backtick code
[project.markdown_extensions.pymdownx.keys]         # Keyboard key combinations (++ctrl+c++ → styled key badges)
[project.markdown_extensions.pymdownx.magiclink]    # Auto-links bare URLs, emails, and repository references
[project.markdown_extensions.pymdownx.mark]         # Text highlighting with ==text== syntax
[project.markdown_extensions.pymdownx.smartsymbols] # ASCII sequences to typographic symbols (e.g. (c) → ©)

[project.markdown_extensions.pymdownx.snippets]     # File inclusion — auto-appends the abbreviations glossary
auto_append = ["includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.superfences]  # Extended fenced code blocks with custom fence types
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } # Mermaid diagrams
]

[project.markdown_extensions.pymdownx.tabbed]       # Tabbed content sections (=== "Tab label")
alternate_style     = true  # CSS-only tab implementation (no JavaScript)
combine_header_slug = true  # Combines tab label into heading slug for stable anchor links

[project.markdown_extensions.pymdownx.tasklist]     # Task list checkboxes (- [x] done  /  - [ ] todo)
custom_checkbox = true  # Replaces default HTML checkboxes with styled SVG icons

[project.markdown_extensions.pymdownx.tilde]        # Strikethrough (~~text~~) and subscript (~text~) syntax

[project.markdown_extensions.pymdownx.blocks.caption]